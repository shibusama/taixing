<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>钛星 · 内容管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #e0e0e0; min-height: 100vh; }
        
        .header { background: #111; border-bottom: 1px solid #333; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 20px; color: #00d4ff; }
        .header a { color: #888; text-decoration: none; font-size: 14px; }
        .header a:hover { color: #00d4ff; }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 30px; }
        
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 20px; }
        .stat-label { font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 8px; }
        .stat-value { font-size: 32px; font-weight: bold; color: #00d4ff; }
        .stat-value.new { color: #00ff88; }
        
        .crawl-section { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .crawl-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .crawl-header h2 { font-size: 18px; color: #fff; }
        .crawl-status { padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .status-idle { background: #333; color: #888; }
        .status-running { background: #00d4ff; color: #000; animation: pulse 1.5s infinite; }
        .status-success { background: #00ff88; color: #000; }
        .status-failed { background: #ff4444; color: #fff; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        
        .controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .controls select, .controls button { padding: 8px 16px; border: 1px solid #444; border-radius: 4px; background: #222; color: #fff; cursor: pointer; font-size: 14px; }
        .controls button { background: #00d4ff; color: #000; border: none; font-weight: bold; }
        .controls button:hover { background: #00b8e6; }
        .controls button.secondary { background: #444; color: #fff; }
        .controls button.secondary:hover { background: #555; }
        
        .log-container { background: #0a0a0a; border: 1px solid #333; border-radius: 4px; padding: 15px; max-height: 300px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 12px; line-height: 1.6; }
        .log-line { margin-bottom: 4px; }
        .log-time { color: #666; }
        .log-info { color: #00d4ff; }
        .log-success { color: #00ff88; }
        .log-error { color: #ff4444; }
        .log-warning { color: #ffaa00; }
        
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; margin-bottom: 20px; }
        .card-header { padding: 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .card-header h2 { font-size: 18px; color: #fff; }
        .filter-group { display: flex; gap: 10px; }
        .filter-group select { padding: 6px 12px; border: 1px solid #444; border-radius: 4px; background: #222; color: #fff; }
        .filter-group button { padding: 6px 16px; background: #00d4ff; color: #000; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        .card-body { padding: 20px; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #2a2a2a; }
        th { color: #888; font-size: 12px; text-transform: uppercase; }
        td { font-size: 14px; }
        .title-cell { max-width: 400px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .date-cell { color: #888; font-size: 12px; }
        .status-new { color: #00ff88; }
        .status-published { color: #888; }
        .actions { display: flex; gap: 8px; }
        .actions button { padding: 4px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .actions button:first-child { background: #00d4ff; color: #000; }
        .actions button.danger { background: #ff4444; color: #fff; }
        
        .empty { text-align: center; padding: 40px; color: #888; }
        .empty-icon { font-size: 48px; margin-bottom: 10px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 30px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { font-size: 18px; color: #fff; }
        .modal-close { background: none; border: none; color: #888; font-size: 24px; cursor: pointer; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #888; font-size: 12px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #444; border-radius: 4px; background: #222; color: #fff; }
        .form-group textarea { min-height: 100px; font-family: monospace; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        .modal-actions button { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .modal-actions button:first-child { background: #00d4ff; color: #000; }
        .modal-actions button:last-child { background: #444; color: #fff; }
    </style>
</head>
<body>
    <div class="header">
        <h1>钛星 · 内容管理后台</h1>
        <a href="/">← 返回前台</a>
    </div>
    
    <div class="container">
        <!-- 统计卡片 -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">总文章数</div>
                <div class="stat-value" id="stat-total">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">待处理</div>
                <div class="stat-value new" id="stat-new">0</div>
            </div>
        </div>
        
        <!-- 爬虫控制台 -->
        <div class="crawl-section">
            <div class="crawl-header">
                <h2>🚀 爬虫控制台</h2>
                <span id="crawl-status" class="crawl-status status-idle">空闲</span>
            </div>
            <div class="controls">
                <select id="crawl-board">
                    <option value="">选择版块</option>
                    <option value="rocket">可回收火箭</option>
                    <option value="moon">中美登月</option>
                    <option value="semiconductor">中国半导体</option>
                    <option value="china-tech">中国科技 AI</option>
                    <option value="mega-projects">中国大工程</option>
                    <option value="controlled-fusion">可控核聚变</option>
                    <option value="finance">科技资本</option>
                </select>
                <button onclick="startCrawl()">开始抓取</button>
                <button onclick="startCrawlAll()" class="secondary">抓取全部</button>
                <button onclick="clearLogs()" class="secondary">清空日志</button>
            </div>
            <div class="log-container" id="log-container">
                <div class="log-line"><span class="log-info">等待爬虫启动...</span></div>
            </div>
        </div>

        <!-- 文章列表 -->
        <div class="card">
            <div class="card-header">
                <h2>原始文章列表</h2>
                <div class="filter-group">
                    <select id="filter-board">
                        <option value="">全部版块</option>
                        <option value="rocket">可回收火箭</option>
                        <option value="moon">中美登月</option>
                        <option value="semiconductor">中国半导体</option>
                        <option value="china-tech">中国科技 AI</option>
                        <option value="mega-projects">中国大工程</option>
                        <option value="controlled-fusion">可控核聚变</option>
                        <option value="finance">科技资本</option>
                    </select>
                    <select id="sort-by">
                        <option value="created_at">按创建时间</option>
                        <option value="date">按文章日期</option>
                        <option value="source">按来源</option>
                    </select>
                    <select id="sort-order">
                        <option value="desc">降序</option>
                        <option value="asc">升序</option>
                    </select>
                    <button onclick="loadArticles()">刷新</button>
                </div>
            </div>
            <div class="card-body">
                <div id="articles-content">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 发布模态框 -->
    <div class="modal" id="publish-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>发布文章</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="form-group">
                <label>标题</label>
                <input type="text" id="pub-title" readonly>
            </div>
            <div class="form-group">
                <label>目标版块</label>
                <select id="pub-board">
                    <option value="rocket">可回收火箭</option>
                    <option value="moon">中美登月</option>
                    <option value="semiconductor">中国半导体</option>
                    <option value="china-tech">中国科技 AI</option>
                    <option value="mega-projects">中国大工程</option>
                    <option value="controlled-fusion">可控核聚变</option>
                    <option value="finance">科技资本</option>
                </select>
            </div>
            <div class="form-group">
                <label>目标表</label>
                <select id="pub-table">
                    <option value="rocket_highlights">rocket_highlights</option>
                    <option value="rocket_timeline">rocket_timeline</option>
                    <option value="moon_highlights">moon_highlights</option>
                    <option value="semiconductor_highlights">semiconductor_highlights</option>
                    <option value="china_tech_highlights">china_tech_highlights</option>
                    <option value="mega_project_highlights">mega_project_highlights</option>
                    <option value="fusion_highlights">fusion_highlights</option>
                    <option value="finance_highlights">finance_highlights</option>
                </select>
            </div>
            <div class="form-group">
                <label>内容 (JSON)</label>
                <textarea id="pub-content"></textarea>
            </div>
            <div class="modal-actions">
                <button onclick="doPublish()">确认发布</button>
                <button onclick="closeModal()">取消</button>
            </div>
        </div>
    </div>
    
    <script>
        let currentArticle = null;
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        async function loadArticles() {
            const boardId = document.getElementById('filter-board').value;
            const sortBy = document.getElementById('sort-by').value;
            const sortOrder = document.getElementById('sort-order').value;
            const content = document.getElementById('articles-content');
            
            try {
                const url = boardId ? `/api/admin/articles?board_id=${boardId}` : '/api/admin/articles';
                const res = await fetch(url);
                const data = await res.json();
                
                document.getElementById('stat-total').textContent = data.stats?.total || 0;
                document.getElementById('stat-new').textContent = data.stats?.new || 0;
                
                if (!data.articles || data.articles.length === 0) {
                    content.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><div>暂无数据</div></div>';
                    return;
                }
                
                // 排序
                let articles = data.articles;
                articles.sort((a, b) => {
                    let valA = a[sortBy] || '';
                    let valB = b[sortBy] || '';
                    if (sortBy === 'created_at' || sortBy === 'date') {
                        valA = new Date(valA).getTime() || 0;
                        valB = new Date(valB).getTime() || 0;
                    } else {
                        valA = valA.toString().toLowerCase();
                        valB = valB.toString().toLowerCase();
                    }
                    if (valA < valB) return sortOrder === 'asc' ? -1 : 1;
                    if (valA > valB) return sortOrder === 'asc' ? 1 : -1;
                    return 0;
                });
                
                let html = '<table><thead><tr><th>标题</th><th>来源</th><th>日期</th><th>状态</th><th>操作</th></tr></thead><tbody>';
                for (const article of articles) {
                    const statusClass = article.is_new === 'true' ? 'status-new' : 'status-published';
                    const statusText = article.is_new === 'true' ? '待处理' : '已发布';
                    html += `
                        <tr>
                            <td class="title-cell" title="${escapeHtml(article.title)}">${escapeHtml(article.title)}</td>
                            <td>${escapeHtml(article.source)}</td>
                            <td class="date-cell">${article.date || '-'}</td>
                            <td class="${statusClass}">${statusText}</td>
                            <td class="actions">
                                <button onclick='openPublishModal(${JSON.stringify(article)})'>发布</button>
                                <button class="danger" onclick="deleteArticle(${article.id})">删除</button>
                            </td>
                        </tr>
                    `;
                }
                html += '</tbody></table>';
                content.innerHTML = html;
            } catch (e) {
                content.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div>加载失败：${e.message}</div></div>`;
            }
        }
        
        function openPublishModal(article) {
            currentArticle = article;
            document.getElementById('pub-title').value = article.title;
            document.getElementById('pub-content').value = JSON.stringify({
                num: '',
                label: article.title,
                color: 'cyan',
                sort_order: 0
            }, null, 2);
            document.getElementById('publish-modal').classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('publish-modal').classList.remove('active');
            currentArticle = null;
        }
        
        async function doPublish() {
            if (!currentArticle) return;
            
            const boardId = document.getElementById('pub-board').value;
            const targetTable = document.getElementById('pub-table').value;
            const content = JSON.parse(document.getElementById('pub-content').value);
            
            try {
                const res = await fetch(`/api/admin/articles/${currentArticle.id}/publish`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ board_id: boardId, target_table: targetTable, content })
                });
                const data = await res.json();
                
                if (res.ok) {
                    alert('发布成功！');
                    closeModal();
                    loadArticles();
                } else {
                    alert(`发布失败：${data.detail}`);
                }
            } catch (e) {
                alert(`发布失败：${e.message}`);
            }
        }
        
        async function deleteArticle(id) {
            if (!confirm('确定要删除这篇文章吗？')) return;
            
            try {
                const res = await fetch(`/api/admin/articles/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    loadArticles();
                } else {
                    alert('删除失败');
                }
            } catch (e) {
                alert(`删除失败：${e.message}`);
            }
        }
        
        // 爬虫相关函数
        let crawlPollingTimer = null;
        
        function addLog(message, type = 'info') {
            const container = document.getElementById('log-container');
            const time = new Date().toLocaleTimeString();
            const line = document.createElement('div');
            line.className = 'log-line';
            line.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-${type}">${message}</span>`;
            container.appendChild(line);
            container.scrollTop = container.scrollHeight;
        }
        
        function clearLogs() {
            document.getElementById('log-container').innerHTML = '';
            addLog('日志已清空', 'info');
        }
        
        function updateCrawlStatus(status) {
            const el = document.getElementById('crawl-status');
            el.className = `crawl-status status-${status}`;
            const labels = { idle: '空闲', running: '运行中', success: '成功', failed: '失败' };
            el.textContent = labels[status] || status;
        }
        
        async function startCrawl() {
            const boardId = document.getElementById('crawl-board').value;
            if (!boardId) {
                alert('请选择版块');
                return;
            }
            
            updateCrawlStatus('running');
            addLog(`开始抓取：${boardId}`, 'info');
            
            try {
                const res = await fetch(`/api/crawl/${boardId}/start`, { method: 'POST' });
                const data = await res.json();
                addLog(`爬虫已启动`, 'success');
                
                // 开始轮询日志
                if (crawlPollingTimer) clearInterval(crawlPollingTimer);
                crawlPollingTimer = setInterval(() => pollCrawlLogs(boardId), 1000);
            } catch (e) {
                addLog(`启动失败：${e.message}`, 'error');
                updateCrawlStatus('failed');
            }
        }
        
        async function startCrawlAll() {
            updateCrawlStatus('running');
            addLog('开始抓取全部版块...', 'info');
            
            const boards = ['rocket', 'moon', 'semiconductor', 'china-tech', 'mega-projects', 'controlled-fusion', 'finance'];
            
            for (const boardId of boards) {
                try {
                    const res = await fetch(`/api/crawl/${boardId}/start`, { method: 'POST' });
                    addLog(`[${boardId}] 爬虫已启动`, 'info');
                    await new Promise(r => setTimeout(r, 500));
                } catch (e) {
                    addLog(`[${boardId}] 启动失败：${e.message}`, 'error');
                }
            }
            
            addLog('全部爬虫已启动，等待完成...', 'info');
            
            // 轮询最后一个版块的日志
            if (crawlPollingTimer) clearInterval(crawlPollingTimer);
            crawlPollingTimer = setInterval(() => pollCrawlLogs(boards[boards.length - 1]), 2000);
        }
        
        async function pollCrawlLogs(boardId) {
            try {
                const res = await fetch(`/api/crawl/${boardId}/logs`);
                const data = await res.json();
                
                if (data.status === 'idle') {
                    // 空闲状态，停止轮询
                    if (crawlPollingTimer) {
                        clearInterval(crawlPollingTimer);
                        crawlPollingTimer = null;
                    }
                    return;
                }
                
                // 显示新日志
                const container = document.getElementById('log-container');
                const currentLines = container.querySelectorAll('.log-line').length;
                
                if (data.lines && data.lines.length > currentLines) {
                    for (let i = currentLines; i < data.lines.length; i++) {
                        const line = data.lines[i];
                        const type = line.includes('错误') ? 'error' : line.includes('完成') ? 'success' : 'info';
                        addLog(line, type);
                    }
                }
                
                // 更新状态
                updateCrawlStatus(data.status);
                
                // 如果完成了，停止轮询
                if (data.status === 'success' || data.status === 'failed') {
                    if (crawlPollingTimer) {
                        clearInterval(crawlPollingTimer);
                        crawlPollingTimer = null;
                    }
                    addLog(`抓取${data.status === 'success' ? '成功' : '失败'}`, data.status);
                    // 自动刷新文章列表
                    loadArticles();
                }
            } catch (e) {
                console.error('Polling error:', e);
                // 出错也停止轮询
                if (crawlPollingTimer) {
                    clearInterval(crawlPollingTimer);
                    crawlPollingTimer = null;
                }
            }
        }
        
        // 页面加载时获取文章列表
        loadArticles();
    </script>
</body>
</html>
