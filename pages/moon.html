<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>钛星 · 中美登月竞速</title>
<link rel="stylesheet" href="css/style.css?v=20260822">
<style>
/* =========================================================
   版块页重设计 · 中美登月（accent = 金色）
   参照 china-tech.html 页面级样式，仅作用于本页
   ========================================================= */
.bd-page{--accent:var(--gold);--accent-soft:rgba(240,192,96,.14)}

/* ---- 版块 Hero ---- */
.bd-hero{position:relative;overflow:hidden;padding:34px 36px 26px;margin:16px 0 26px;border:1px solid rgba(255,255,255,.10);border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025) 55%,rgba(255,255,255,.01));backdrop-filter:blur(10px) saturate(120%);-webkit-backdrop-filter:blur(10px) saturate(120%);box-shadow:0 6px 20px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.05);min-height:300px}
.bd-hero::before{content:"";position:absolute;top:-130px;right:-90px;width:430px;height:430px;border-radius:50%;background:var(--accent);opacity:.10;filter:blur(80px);pointer-events:none}
.bd-hero::after{content:"";position:absolute;bottom:-150px;left:-70px;width:360px;height:360px;border-radius:50%;background:var(--cyan);opacity:.06;filter:blur(80px);pointer-events:none}
.bd-hero>*{position:relative;z-index:1}
.bd-hero .breadcrumb{padding:0;margin-bottom:16px}
.bd-hero .kicker{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;margin-bottom:16px;border-radius:999px;border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase}
.bd-hero .kicker::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:bdPulse 2s infinite}
@keyframes bdPulse{0%,100%{opacity:1}50%{opacity:.35}}
.bd-hero h1{font-size:clamp(26px,4vw,42px);font-weight:900;line-height:1.16;letter-spacing:-.5px;margin-bottom:14px}
.bd-hero h1 .glow{background:linear-gradient(120deg,var(--gold),var(--amber) 55%,var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.bd-hero .sub{font-size:14.5px;line-height:1.85;color:var(--txt-1);max-width:840px;margin-bottom:18px}
.bd-hero .meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--txt-2);font-size:12px}
.bd-hero .meta span{display:inline-flex;align-items:center;gap:8px}
.bd-hero .meta span::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent)}
.bd-hero .meta span:first-child::before{display:none}

/* ---- 区块标题（semiconductor 同款） ---- */
.bd-sec-head{display:flex;align-items:center;gap:12px;margin:38px 0 18px;flex-wrap:wrap}
.bd-sec-idx{flex-shrink:0;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:1px;color:var(--accent);padding:3px 9px;border-radius:6px;border:1px solid var(--line);background:var(--accent-soft)}
.bd-sec-head h2{flex:1;margin:0;padding:0;border-left:none;font-size:clamp(18px,2.6vw,22px);line-height:1.4}
.bd-sec-head .bd-sec-desc{flex-basis:100%;font-size:12.5px;color:var(--txt-2);line-height:1.7;margin:0}

/* ---- Tab 导航 ---- */
.bd-tabs{gap:4px;margin:28px 0 4px;border-bottom:2px solid var(--line);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.bd-tabs::-webkit-scrollbar{display:none}
.bd-tabs button{display:inline-flex;align-items:center;gap:7px;padding:11px 18px;font-size:14px;font-weight:700;color:var(--txt-2);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.bd-tabs button .tb-ico{font-size:15px;line-height:1}
.bd-tabs button:hover{color:var(--txt-1)}
.bd-tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ---- Tab 引言 ---- */
.bd-intro{font-size:14px;line-height:1.9;color:var(--txt-1);background:var(--bg-1);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:14px 18px;margin:22px 0 4px}

/* ---- 中美双列 ---- */
.moon-cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:22px 0 8px}
.moon-col-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg-1)}
.moon-col-head .mh-flag{font-size:22px;line-height:1}
.moon-col-head .mh-name{font-size:18px;font-weight:800;color:var(--txt-0)}
.moon-col-head .mh-tag{margin-left:auto;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.moon-col-head.cn{border-bottom:2px solid var(--red)}
.moon-col-head.us{border-bottom:2px solid var(--purple)}
.moon-col-head.cn .mh-tag{background:rgba(255,84,112,.14);color:var(--red)}
.moon-col-head.us .mh-tag{background:rgba(155,123,255,.14);color:var(--purple)}
.moon-col-desc{font-size:13px;color:var(--txt-1);line-height:1.75;margin:0 0 14px}

/* ---- 技术路线步骤 ---- */
.moon-step{display:grid;grid-template-columns:52px 1fr;gap:4px 14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg-1);margin-bottom:10px}
.moon-step .ph{font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--accent);font-family:var(--mono);padding-top:3px}
.moon-step .nm{font-size:15px;font-weight:800;color:var(--txt-0)}
.moon-step .dt{font-size:12px;color:var(--txt-2);margin-top:2px;line-height:1.55}
.moon-step.done{border-color:rgba(61,220,132,.28)}
.moon-step.cur{border-color:rgba(0,224,255,.32)}
.moon-step.next{border-color:rgba(255,138,61,.28)}

/* ---- 南极水冰焦点 ---- */
.moon-focus{margin:28px 0 8px;padding:16px 20px;border-radius:0 12px 12px 0;border:1px solid rgba(240,192,96,.22);border-left:3px solid var(--gold);background:rgba(240,192,96,.07)}
.moon-focus h3{margin:0 0 8px;font-size:15px;font-weight:800;color:var(--gold)}
.moon-focus p{margin:0;font-size:13.5px;line-height:1.8;color:var(--txt-1)}

/* ---- 年份条 ---- */
.moon-years{display:flex;gap:0;border-radius:12px;overflow:hidden;background:var(--bg-1);margin:22px 0 8px;border:1px solid var(--line)}
.moon-year{flex:1;padding:14px 12px;text-align:center;position:relative;border-right:1px solid var(--line)}
.moon-year:last-child{border-right:none}
.moon-year::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:transparent}
.moon-year.done::before{background:var(--green)}
.moon-year.cur::before{background:var(--cyan)}
.moon-year.next::before{background:var(--amber)}
.moon-year .yr{font-size:13px;font-weight:800;font-family:var(--mono);color:var(--txt-0);margin-bottom:6px}
.moon-year .cn,.moon-year .us{font-size:11px;color:var(--txt-1);line-height:1.45}
.moon-year .cn{color:var(--red)}
.moon-year .us{color:var(--purple);margin-top:2px}

/* ---- 双列时间线 ---- */
.moon-tl-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin:20px 0}
.tl-st{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:700;vertical-align:middle;letter-spacing:.3px}
.tl-st.done{background:rgba(61,220,132,.16);color:var(--green)}
.tl-st.prog{background:rgba(0,224,255,.16);color:var(--cyan)}
.tl-st.plan{background:rgba(255,138,61,.16);color:var(--amber)}
.tl-st.goal{background:rgba(240,192,96,.18);color:var(--gold)}
.tl-item.cyan::before{border-color:var(--cyan);box-shadow:0 0 8px rgba(0,224,255,.5)}
.tl-item.cyan .tl-date{color:var(--cyan)}
.tl-item.gold::before{border-color:var(--gold);box-shadow:0 0 8px rgba(240,192,96,.5)}
.tl-item.gold .tl-date{color:var(--gold)}

/* ---- 响应式 ---- */
@media(max-width:768px){
  .bd-hero{padding:24px 20px 20px;margin:10px 0 20px}
  .bd-hero .meta{gap:10px;font-size:11px}
  .bd-hero .sub{font-size:13.5px}
  .bd-sec-head{flex-wrap:wrap;gap:8px}
  .bd-tabs button{padding:10px 14px;font-size:13px}
  .moon-cols,.moon-tl-grid{grid-template-columns:1fr}
  .moon-years{flex-wrap:wrap}
  .moon-year{flex:1 1 50%;border-bottom:1px solid var(--line)}
  .moon-year:nth-child(2n){border-right:none}
}
@media(max-width:480px){
  .bd-hero h1{font-size:23px}
  .moon-year{flex:1 1 100%;border-right:none}
}
</style>
</head>
<body>
<div class="preloader" aria-hidden="true">
  <div class="pl-logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/><path d="M20 2v4"/><path d="M22 4h-4"/><circle cx="4" cy="20" r="2"/></svg></div>
  <div class="pl-name">钛星 TAIXING</div>
  <div class="pl-bar"><i></i></div>
</div>
<div class="stars"></div>
<div class="progress-bar" id="progressBar"></div>

<div id="header-placeholder"></div>
<article class="article bd-page">
  <div class="wrap">

    <!-- ===== 版块 Hero（参照 semiconductor 风格） ===== -->
    <div class="bd-hero">
      <div class="breadcrumb"><a href="index.html">首页</a> <span class="sep">›</span> <span>中美登月</span></div>
      <div class="kicker">MOON RACE · 2026</div>
      <h1><span class="glow">中美登月竞速：从南极水冰到载人登月</span></h1>
      <p class="sub">2026 年是中美月球探索的关键之年：中国嫦娥七号 8 月出征南极，载人登月工程全面转入工程验证阶段；美国 Artemis II 刚刚完成历史性载人绕月飞行。两国在月球南极的战略博弈日益白热化。</p>
      <div class="meta">
        <span>数据来源：中国载人航天工程办公室、NASA、虎嗅（公开信源聚合 · AI 解读）</span>
        <span>更新时间：2026-07-26</span>
      </div>
    </div>

    <div class="highlight-row" id="moon-highlights"></div>

    <nav class="tab-nav bd-tabs" id="moon-tabs">
      <button class="active" data-tab="tab-roadmap"><span class="tb-ico">🗺️</span>技术路线图</button>
      <button data-tab="tab-timeline"><span class="tb-ico">📅</span>登月时间表</button>
    </nav>

    <section class="tab-panel active" id="tab-roadmap">
      <p class="bd-intro" id="moon-roadmap-intro"></p>
      <div class="moon-cols" id="moon-roadmaps"></div>
      <div class="moon-focus" id="moon-focus" hidden></div>
      <div class="bd-sec-head"><span class="bd-sec-idx">对照</span><h2>中美登月路线对比</h2><p class="bd-sec-desc">维度、节奏与组织模式的全景对照。</p></div>
      <div class="cmp-wrap" id="moon-compare">
        <table class="cmp"><thead><tr><th>维度</th><th>中国</th><th>美国</th></tr></thead><tbody></tbody></table>
      </div>
    </section>

    <section class="tab-panel" id="tab-timeline">
      <p class="bd-intro" id="moon-tl-intro"></p>
      <div class="moon-years" id="moon-years"></div>
      <div class="moon-tl-grid" id="moon-timelines"></div>
    </section>

  </div>
</article>

<button class="back-to-top" aria-label="回到顶部" title="回到顶部">↑</button>

<div id="footer-placeholder"></div>
<script src="js/app.js?v=20260821"></script>
<script src="js/data-loader.js?v=20260820"></script>
<script>
(async function(){
  const ST_LABEL = { done: '已完成', prog: '进行中', plan: '计划', goal: '目标' };
  const ST_COLOR = { done: 'green', prog: 'cyan', plan: 'amber', goal: 'gold' };

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function renderCard(item) {
    const grid = (item.grid || []).map(kv =>
      `<div class="kv"><div class="k">${esc(kv.k)}</div><div class="v">${esc(kv.v)}</div></div>`
    ).join('');
    return `<div class="company">
      <span class="company-flag ${esc(item.flag_cls || '')}">${esc(item.flag || '')}</span>
      <h3>${esc(item.title || '')}</h3>
      ${item.en ? `<div class="en">${esc(item.en)}</div>` : ''}
      ${item.desc ? `<p>${esc(item.desc)}</p>` : ''}
      ${grid ? `<div class="company-grid">${grid}</div>` : ''}
      ${item.note ? `<p><strong>任务流程：</strong>${esc(item.note.replace(/^任务流程：/, ''))}</p>` : ''}
    </div>`;
  }

  function renderSideHead(side) {
    return `<div class="moon-col-head ${esc(side.head_cls || '')}">
      <span class="mh-flag">${side.flag || ''}</span>
      <span class="mh-name">${esc(side.name || '')}</span>
      <span class="mh-tag">${esc(side.tag || '')}</span>
    </div>
    ${side.desc ? `<p class="moon-col-desc">${esc(side.desc)}</p>` : ''}`;
  }

  try {
    let file = await fetch('data/moon.json').then(r => r.json());
    let d = file;
    try {
      const api = await taixingData.loadData('moon');
      if (api && Array.isArray(api.highlights) && api.highlights.length) {
        d = Object.assign({}, file, {
          highlights: api.highlights,
          comparison: (api.comparison && api.comparison.length) ? api.comparison : file.comparison
        });
      }
    } catch (e) { /* 使用本地 JSON */ }

    const hls = d.highlights || [];
    document.getElementById('moon-highlights').innerHTML = hls.map(h =>
      `<div class="hl-card ${esc(h.color || 'cyan')}"><div class="hl-num">${esc(h.num || '')}</div><div class="hl-lbl">${esc(h.lbl || h.label || '')}</div></div>`
    ).join('');

    const rm = d.roadmaps || {};
    const introEl = document.getElementById('moon-roadmap-intro');
    if (rm.intro) introEl.textContent = rm.intro;
    else introEl.hidden = true;

    document.getElementById('moon-roadmaps').innerHTML = (rm.sides || []).map(side => {
      const steps = (side.steps || []).map(st =>
        `<div class="moon-step ${esc(st.status || '')}">
          <div class="ph">${esc(st.phase || '')}</div>
          <div><div class="nm">${esc(st.name || '')}</div><div class="dt">${esc(st.detail || '')}</div></div>
        </div>`
      ).join('');
      const cards = (side.items || []).map(renderCard).join('');
      return `<div class="moon-col">${renderSideHead(side)}${steps}${cards}</div>`;
    }).join('');

    const focus = rm.focus;
    const focusEl = document.getElementById('moon-focus');
    if (focus && (focus.title || focus.text)) {
      focusEl.hidden = false;
      focusEl.innerHTML = `${focus.title ? `<h3>🔬 ${esc(focus.title)}</h3>` : ''}${focus.text ? `<p>${esc(focus.text)}</p>` : ''}`;
    }

    const cmp = d.comparison || [];
    document.querySelector('#moon-compare tbody').innerHTML = cmp.map(r =>
      `<tr><td>${esc(r.dim || r.aspect || '')}</td><td${r.highlight === 'china' ? ' class="hi"' : ''}>${esc(r.china || r.china_value || '')}</td><td>${esc(r.us || r.usa_value || '')}</td></tr>`
    ).join('');

    const tl = d.timelines || {};
    const tlIntro = document.getElementById('moon-tl-intro');
    if (tl.intro) tlIntro.textContent = tl.intro;
    else tlIntro.hidden = true;

    document.getElementById('moon-years').innerHTML = (tl.milestones || []).map(m =>
      `<div class="moon-year ${esc(m.status || '')}">
        <div class="yr">${esc(m.year || '')}</div>
        <div class="cn">中 · ${esc(m.cn || '')}</div>
        <div class="us">美 · ${esc(m.us || '')}</div>
      </div>`
    ).join('');

    document.getElementById('moon-timelines').innerHTML = (tl.sides || []).map(side => {
      const items = (side.items || []).map(it => {
        const st = it.status || 'plan';
        const color = it.color || ST_COLOR[st] || '';
        const badge = ST_LABEL[st] ? `<span class="tl-st ${esc(st)}">${ST_LABEL[st]}</span>` : '';
        return `<div class="tl-item ${esc(color)}">
          <div class="tl-date">${esc(it.date || '')}${badge}</div>
          <h4>${esc(it.title || '')}</h4>
          <p>${esc(it.desc || '')}</p>
        </div>`;
      }).join('');
      return `<div class="fusion-tl-col">
        <div class="fusion-tl-head ${esc(side.head_cls || '')}">
          <span class="ft-flag">${side.flag || ''}</span>
          <span class="ft-name">${esc(side.name || '')}</span>
          <span class="ft-tag">${esc(side.tag || '')}</span>
        </div>
        <div class="tl">${items}</div>
      </div>`;
    }).join('');
  } catch(e) { console.error('Moon data load failed:', e); }

  var tabs = document.querySelectorAll('#moon-tabs button');
  var panels = document.querySelectorAll('.tab-panel');
  tabs.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var target = btn.getAttribute('data-tab');
      tabs.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      panels.forEach(function (p) { p.classList.toggle('active', p.id === target); });
    });
  });
})();
</script>
