<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>钛星 · 内容管理后台</title>
    <link rel="stylesheet" href="css/style.css?v=20260822">
</head>
<body>
    <div class="stars"></div>

    <div class="header">
        <h1><svg class="spark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/><path d="M20 2v4"/><path d="M22 4h-4"/><circle cx="4" cy="20" r="2"/></svg> 钛星 · 内容管理后台</h1>
        <a href="/">← 返回前台</a>
    </div>

    <div class="container">
        <!-- 模块导航 -->
        <nav class="admin-tabs" id="admin-tabs">
            <button class="admin-tab on" data-tab="crawl">🚀 爬虫控制台</button>
        </nav>

        <!-- ============ 爬虫控制台 ============ -->
        <section class="admin-panel" id="panel-crawl">
            <div class="crawl-section">
                <div class="crawl-header">
                    <h2>🚀 爬虫控制台</h2>
                    <span id="crawl-status" class="crawl-status status-idle">空闲</span>
                </div>
                <div class="controls">
                    <select id="crawl-board">
                        <option value="">选择版块</option>
                        <option value="rocket">可回收火箭</option>
                        <option value="moon">中美登月</option>
                        <option value="semiconductor">中国半导体</option>
                        <option value="china-tech">中国科技 AI</option>
                        <option value="mega-projects">中国超级工程</option>
                        <option value="controlled-fusion">可控核聚变</option>
                        <option value="finance">科技资本</option>
                    </select>
                    <button onclick="startCrawl()">开始抓取</button>
                    <button onclick="startCrawlAll()" class="secondary">抓取全部</button>
                    <button onclick="startMacroCrawl()" class="macro-btn" title="运行宏观指标爬虫（利率/国债/汇率/期货/商品），写入 data/macro.json">🪙 抓取宏观指标</button>
                    <button onclick="clearLogs()" class="secondary">清空日志</button>
                </div>
                <div class="log-container" id="log-container">
                    <div class="log-line"><span class="log-info">等待爬虫启动...</span></div>
                </div>
            </div>
        </section>
    </div>

    <script src="js/components.js?v=20260820"></script>
    <script src="js/admin.js?v=20260820"></script>
</body>
</html>
